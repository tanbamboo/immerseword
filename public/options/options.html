<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ImmerseWord — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <header class="opt-header">
    <div class="opt-logo" aria-hidden="true">Iw</div>
    <div>
      <h1>ImmerseWord Settings</h1>
      <p class="opt-sub" id="opt-version"></p>
    </div>
  </header>

  <main class="opt-grid">
    <section class="opt-card">
      <h2>Reading</h2>
      <label class="opt-row">
        <span>My level — words beyond this band are flagged</span>
        <select id="opt-level">
          <option value="2k">Top 2,000</option>
          <option value="5k">Top 5,000</option>
          <option value="10k">Top 10,000</option>
          <option value="20k">Top 20,000</option>
        </select>
      </label>
      <label class="opt-row">
        <span>Tag unknown words on pages</span>
        <input type="checkbox" id="opt-tagging" />
      </label>
      <label class="opt-row">
        <span>Pass 1: show faint marks instead of hiding tags</span>
        <input type="checkbox" id="opt-pass1-marks" />
      </label>
      <label class="opt-row">
        <span>Online dictionary fallback for rare words</span>
        <input type="checkbox" id="opt-online" />
      </label>
      <p class="opt-hint">Turn this off for a fully offline extension — definitions then come only from the bundled dictionary.</p>
    </section>

    <section class="opt-card">
      <h2>Reader defaults</h2>
      <div class="opt-two">
        <label class="opt-row">
          <span>Theme</span>
          <select id="opt-theme">
            <option value="light">Light</option>
            <option value="sepia">Sepia</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label class="opt-row">
          <span>Font</span>
          <select id="opt-font">
            <option value="serif">Serif</option>
            <option value="sans">Sans-serif</option>
          </select>
        </label>
        <label class="opt-row">
          <span>Text size</span>
          <input type="range" id="opt-size" min="16" max="24" step="1" />
        </label>
        <label class="opt-row">
          <span>Line width</span>
          <select id="opt-width">
            <option value="narrow">Narrow</option>
            <option value="medium">Medium</option>
            <option value="wide">Wide</option>
          </select>
        </label>
      </div>
    </section>

    <section class="opt-card">
      <h2>Your data</h2>
      <p class="opt-hint">Everything lives on this device. Export a backup or move your vocabulary to another computer.</p>
      <div class="opt-actions">
        <button id="opt-export" class="opt-btn">Export data</button>
        <button id="opt-import" class="opt-btn">Import from text below</button>
        <button id="opt-clear-cache" class="opt-btn subtle">Clear dictionary cache</button>
        <button id="opt-reset-vocab" class="opt-btn danger">Reset vocabulary…</button>
      </div>
      <textarea id="opt-io" rows="8" spellcheck="false" placeholder="Exported data appears here. Paste data here to import."></textarea>
      <p class="opt-status" id="opt-status"></p>
    </section>

    <section class="opt-card">
      <h2>About &amp; licenses</h2>
      <p id="opt-about" class="opt-hint"></p>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
