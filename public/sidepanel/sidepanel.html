<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ImmerseWord</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="iw-header">
    <div class="iw-logo" aria-hidden="true">Iw</div>
    <div>
      <h1>ImmerseWord</h1>
      <p class="iw-version" id="iw-version">…</p>
    </div>
  </header>
  <main class="iw-body">
    <section class="iw-card">
      <h2>Reading companion</h2>
      <p id="iw-status">Checking this page…</p>
    </section>
    <section class="iw-card iw-hint">
      <h2>The 3-pass method</h2>
      <ol>
        <li><strong>Gist</strong> — read for overall meaning, don't stop.</li>
        <li><strong>Study</strong> — tap unknown words, read English definitions.</li>
        <li><strong>Fluency</strong> — reread at full speed.</li>
      </ol>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
